<style>
:root{
  --font:"Roboto Flex",Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --std:cubic-bezier(.2,0,0,1);--emph-in:cubic-bezier(.3,0,.8,.15);--emph-out:cubic-bezier(.05,.7,.1,1);
  --nav-h:80px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--on-s);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;min-height:100dvh}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:root[data-motion=reduced] *,:root[data-motion=reduced] *::before,:root[data-motion=reduced] *::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}

/* ---------- shell ---------- */
#app{transition:opacity 90ms var(--std)}
#app.out,#session.out{opacity:0}
.view{max-width:640px;margin:0 auto;padding:calc(var(--st) + 16px) 16px calc(var(--nav-h) + var(--sb) + 40px)}
.view>*+*{margin-top:12px}
.view.out{opacity:0;transition:opacity 90ms var(--std)}
@keyframes up{from{transform:translateY(18px)}}
@keyframes fi{from{opacity:0}}
.view.in>*,#session.in .ss>*{animation:up var(--sp-def-d) var(--sp-def) backwards,fi 220ms var(--std) backwards;animation-delay:calc(var(--i,0)*32ms)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 4px 8px;min-height:64px}
.top h1{margin:0;font-size:34px;line-height:40px;font-weight:680;font-variation-settings:"wdth" 115,"opsz" 36;letter-spacing:-.4px}
.over{font-size:14px;font-weight:500;color:var(--on-s-v);margin-bottom:2px}
.sh{display:flex;align-items:center;gap:4px;margin:28px 4px 10px;font-size:18px;line-height:24px;font-weight:650;font-variation-settings:"wdth" 108}
.sh .sp{flex:1}
.sub{font-size:14px;color:var(--on-s-v)}
.card{background:var(--sc);border-radius:28px;padding:20px;position:relative}
.card.hi{background:var(--sc-high)}
.ct{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:650;margin-bottom:12px}
.ct .sp{flex:1}
.ro{font-size:13px;color:var(--on-s-v);font-variant-numeric:tabular-nums;min-height:18px;margin:-6px 0 10px}
.empty{color:var(--on-s-v);font-size:14px;padding:6px 4px}

/* ---------- nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sc);padding:12px 0 calc(14px + var(--sb))}
#nav .nv{display:flex;max-width:640px;margin:0 auto}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:550;color:var(--on-s-v);min-height:56px;letter-spacing:.2px;transition:color 200ms var(--std)}
#nav .nl{transition:font-weight 200ms var(--std)}
#nav .ni{position:relative;width:56px;height:32px;display:grid;place-items:center}
#nav .ni::before{content:'';position:absolute;inset:0;border-radius:16px;background:var(--sec-c);transform:scaleX(.35);opacity:0;transition:transform var(--sp-fast-d) var(--sp-fast),opacity 120ms var(--std)}
#nav button:active .ni::before{opacity:.5}
#nav button.on .ni::before{transform:none;opacity:1}
#nav .ni svg{position:relative;transition:transform var(--sp-fast-d) var(--sp-fast)}
#nav button:active .ni svg{transform:scale(.88)}
#nav button.on{color:var(--on-s)}
#nav button.on .ni{color:var(--on-sec-c)}
#nav button.on .nl{font-weight:750}
#mini{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--sb) + 22px);z-index:29;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:12px;height:60px;padding:0 8px 0 18px;border-radius:30px;background:var(--pri);color:var(--on-pri);box-shadow:0 6px 18px rgb(0 0 0/.18);animation:up var(--sp-def-d) var(--sp-def) backwards,fi 200ms var(--std) backwards;overflow:hidden;transition:transform var(--sp-fast-d) var(--sp-fast)}
#mini:active{transform:scale(.98)}
#mini .dot{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
#mini.paused .dot{animation:none;opacity:.5}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
#mini .mt{flex:1;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mc{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:20px;background:var(--pri);color:var(--on-pri);font-weight:650;font-size:14px;letter-spacing:.1px;position:relative;overflow:hidden;white-space:nowrap;transition:border-radius var(--sp-fast-d) var(--sp-fast),background-color 200ms var(--std),color 200ms var(--std),opacity 200ms var(--std)}
.btn:active{border-radius:10px}
.btn svg.i{width:20px;height:20px}
.btn.tonal{background:var(--sec-c);color:var(--on-sec-c)}
.btn.prc{background:var(--pri-c);color:var(--on-pri-c)}
.btn.text{background:none;color:var(--pri);padding:0 12px}
.btn.out{background:none;color:var(--on-s-v);box-shadow:inset 0 0 0 1px var(--outline-v)}
.btn.danger{background:var(--err);color:var(--on-err)}
.btn.big{height:64px;border-radius:32px;font-size:18px;padding:0 28px;font-variation-settings:"wdth" 110}
.btn.big:active{border-radius:18px}
.btn.big svg.i{width:28px;height:28px}
.btn.sq{width:64px;padding:0}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;pointer-events:none}
.ib{width:48px;height:48px;border-radius:24px;display:inline-grid;place-items:center;color:var(--on-s-v);position:relative;overflow:hidden;flex:none;transition:border-radius var(--sp-fast-d) var(--sp-fast),background-color 200ms var(--std),color 200ms var(--std),opacity 200ms var(--std)}
.ib:active{border-radius:14px}
.ib.ton{background:var(--sc-highest);color:var(--on-s)}
.ib.sm{width:36px;height:36px}
.ib.sm svg.i{width:20px;height:20px}
.ib.tip{width:32px;height:32px;color:var(--on-s-v);opacity:.8}
.ib.tip svg.i{width:18px;height:18px}
.ib:disabled{opacity:.3;pointer-events:none}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--nav-h) + var(--sb) + 20px);z-index:20;width:64px;height:64px;border-radius:20px;background:var(--pri-c);color:var(--on-pri-c);display:grid;place-items:center;box-shadow:0 4px 12px rgb(0 0 0/.16);overflow:hidden;transition:border-radius var(--sp-fast-d) var(--sp-fast)}
.fab:active{border-radius:32px}
.fab svg.i{width:28px;height:28px}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);pointer-events:none;transition:transform 420ms var(--std),opacity 300ms var(--std)}

/* ---------- chips / seg ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:12px;background:var(--sc-low);box-shadow:inset 0 0 0 1px var(--outline-v);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:550;color:var(--on-s-v);position:relative;overflow:hidden;transition:border-radius var(--sp-fast-d) var(--sp-fast),background-color 180ms var(--std),color 180ms var(--std),box-shadow 180ms var(--std)}
.chip:active{border-radius:8px}
.chip.on{background:var(--sec-c);color:var(--on-sec-c);box-shadow:none;border-radius:20px}
.chip svg.i{width:18px;height:18px}
.seg{display:flex;gap:2px;width:100%}
.seg button{flex:1;min-width:0;height:40px;background:var(--sc-highest);color:var(--on-s-v);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;position:relative;overflow:hidden;transition:border-radius var(--sp-fast-d) var(--sp-fast),background-color 180ms var(--std),color 180ms var(--std)}
.seg button:first-child{border-radius:20px 8px 8px 20px}
.seg button:last-child{border-radius:8px 20px 20px 8px}
.seg button:active{border-radius:6px}
.seg button.on{background:var(--pri);color:var(--on-pri);border-radius:20px}
.seg button svg.i{width:18px;height:18px}
.seg.sm button{height:36px;font-size:13px}

/* ---------- lists ---------- */
.group{display:flex;flex-direction:column;gap:2px;border-radius:24px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;background:var(--sc);width:100%;text-align:left;position:relative;overflow:hidden}
.group.hi .li{background:var(--sc-high)}
.li .lead{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--pri-c);color:var(--on-pri-c);flex:none}
.li .lead svg.i{width:22px;height:22px}
.li .lead.sec{background:var(--sec-c);color:var(--on-sec-c)}
.li .lead.ter{background:var(--ter-c);color:var(--on-ter-c)}
.li .tx{flex:1;min-width:0}
.li .t1,.li .t2{display:block}
.li .t1{font-size:16px;font-weight:550;color:var(--on-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:13px;color:var(--on-s-v);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tr{color:var(--on-s-v);font-size:14px;font-variant-numeric:tabular-nums;flex:none;display:flex;align-items:center;gap:4px}
.li.danger .t1,.li.danger .lead{color:var(--err)}
.li.danger .lead{background:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* ---------- inputs ---------- */
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--sc-highest);box-shadow:inset 0 0 0 2px var(--outline);transition:background-color 200ms var(--std),box-shadow 200ms var(--std)}
.sw span::after{content:'';position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:left var(--sp-fast-d) var(--sp-fast),top var(--sp-fast-d) var(--sp-fast),width var(--sp-fast-d) var(--sp-fast),height var(--sp-fast-d) var(--sp-fast),background-color 200ms var(--std)}
.sw input:checked+span{background:var(--pri);box-shadow:none}
.sw input:checked+span::after{left:24px;top:4px;width:24px;height:24px;background:var(--on-pri)}
.sw input:active+span::after{left:2px;top:2px;width:28px;height:28px}
.sw input:checked:active+span::after{left:22px}
.tf{display:block}
.tf>span{display:block;font-size:12px;color:var(--on-s-v);margin:0 0 6px 6px;font-weight:600;letter-spacing:.3px}
.inp{width:100%;height:52px;border-radius:14px;border:0;background:var(--sc-highest);color:var(--on-s);font:inherit;font-size:16px;padding:0 14px;outline:none;box-shadow:inset 0 0 0 0 var(--pri);transition:box-shadow 150ms var(--std);min-width:0}
.inp:focus{box-shadow:inset 0 0 0 2px var(--pri)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 23px,calc(100% - 12px) 23px;background-size:5px 5px;background-repeat:no-repeat}
.stp{display:inline-flex;align-items:center;gap:2px;background:var(--sc-highest);border-radius:24px;padding:4px;flex:none}
.stp button{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--on-s);position:relative;overflow:hidden;transition:border-radius var(--sp-fast-d) var(--sp-fast),background-color 150ms var(--std),opacity 200ms var(--std)}
.stp button:active{border-radius:10px;background:var(--sc-low)}
.stp button svg.i{width:20px;height:20px}
.stp output{min-width:62px;text-align:center;font-weight:650;font-size:15px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.row .sp{flex:1}
.stack>*+*{margin-top:16px}

/* ---------- sheets / dialogs ---------- */
.layer{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgb(0 0 0/.36);opacity:0;transition:opacity 170ms var(--emph-in)}
.scrim.on{opacity:1;transition:opacity 260ms var(--std)}
.sheet{position:absolute;left:0;right:0;bottom:-48px;margin:0 auto;max-width:640px;max-height:calc(92dvh + 48px);background:var(--sc-low);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform var(--sp-def-d) var(--sp-def);display:flex;flex-direction:column;padding-bottom:calc(48px + var(--sb))}
.sheet.on{transform:none}
.sheet.closing{transition:transform 220ms var(--emph-in)}
.grab{padding:14px 0 10px;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.grab::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--on-s-v);opacity:.4}
.sheet-body{overflow:auto;padding:0 20px 20px;overscroll-behavior:contain}
.st{font-size:24px;line-height:32px;font-weight:650;margin:2px 4px 16px;font-variation-settings:"wdth" 110}
.dlg{position:absolute;left:50%;top:50%;width:min(340px,calc(100vw - 48px));background:var(--sc-high);border-radius:28px;padding:24px;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:transform var(--sp-fast-d) var(--sp-fast),opacity 150ms var(--std)}
.dlg.on{transform:translate(-50%,-50%);opacity:1}
.dlg h3{margin:0 0 12px;font-size:22px;line-height:28px;font-weight:650}
.dlg-b{color:var(--on-s-v);font-size:15px;margin-bottom:20px}
.dlg-a{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
#snack{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + var(--sb) + 16px);z-index:80;max-width:560px;margin:0 auto;min-height:52px;padding:6px 8px 6px 18px;border-radius:14px;background:var(--inv-s);color:var(--inv-on-s);display:flex;align-items:center;gap:8px;font-size:14px;transform:translateY(24px);opacity:0;pointer-events:none;transition:transform var(--sp-fast-d) var(--sp-fast),opacity 160ms var(--std)}
#snack span{flex:1}
#snack .btn.text{color:var(--inv-pri)}
#snack.on{transform:none;opacity:1;pointer-events:auto}
body.in-session #snack{bottom:calc(var(--sb) + 20px)}
#tip{position:absolute;z-index:70;width:280px;padding:14px 16px;border-radius:16px;background:var(--sc-highest);color:var(--on-s);font-size:14px;line-height:1.45;box-shadow:0 6px 20px rgb(0 0 0/.18);opacity:0;transform:scale(.92);transform-origin:top center;pointer-events:none;transition:opacity 140ms var(--std),transform var(--sp-fast-d) var(--sp-fast)}
#tip.on{opacity:1;transform:none;pointer-events:auto}
canvas.confetti{position:fixed;inset:0;z-index:90;pointer-events:none;width:100vw;height:100vh}

/* ---------- today ---------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:24px 20px 20px;background:var(--sc)}
.ringw{position:relative;display:grid;place-items:center;cursor:pointer;transition:transform var(--sp-fast-d) var(--sp-fast)}
.ringw:active{transform:scale(.97)}
.ring path{fill:none;stroke-linecap:round}
.ring .ind{stroke:var(--pri);transition:stroke 300ms var(--std)}

  const o={...f,...d};

function mixData(range){

  for(const s of S.sessions){if(s.start<from)continue;rest+=s.rest||0;for(const it of s.items){const e=exById(it.ex),ci=catIdx(e?.cat);cat[ci]+=it.sec||0;const x=ex.get(it.ex)||{sec:0,reps:0};x.sec+=it.sec||0;x.reps+=it.reps||0;ex.set(it.ex,x)}}
  return{cat,ex:[...ex.entries()].sort((a,b)=>b[1].sec-a[1].sec||b[1].reps-a[1].reps),rest};
}

  const d=mixData(ui.mixRange),tot=d.cat.reduce((a,b)=>a+b,0),top=d.ex.slice(0,8),mx=top[0]?.[1].sec||0,mr=Math.max(1,...top.map(([,x])=>x.reps));

function edInput(el){
  const f=el.dataset.ed,i=+el.dataset.i;

function edSave(){
  const items=ED.items.filter(i=>i.ex&&(i.sec>0||i.reps>0)).map(i=>{const o={ex:i.ex,sec:i.sec||0,reps:i.reps||0};if(Array.isArray(i.sets)&&i.sets.length&&i.sets.reduce((x,y)=>x+y,0)===o.reps)o.sets=i.sets.slice();return o});
  const dur=items.reduce((x,i)=>x+i.sec,0)+(ED.rest||0);
  if(dur<=0&&!items.some(i=>i.reps>0)){snack('Add minutes or reps first');return}

function rtPlan(r,noReady){
  const P=[];
  if(!noReady&&S.settings.ready>0)P.push({ph:'ready',ex:r.warm?warmId():r.steps[0]?.ex,sec:S.settings.ready,rd:0});
  if(r.warm)P.push({ph:'work',ex:warmId(),sec:r.warm,rd:0,label:'Warm-up'});
  const sr=r.setRest??r.rest;
  for(let k=0;k<r.rounds;k++){
    r.steps.forEach((s,i)=>{
      const n=Math.max(1,+s.sets||1);
      for(let j=1;j<=n;j++){
        const w={ph:'work',ex:s.ex,sec:s.sec,rd:k+1};
        if(s.mode==='reps'){w.reps=Math.max(1,+s.reps||10);w.sec=+s.cap||0;if(!w.sec){w.open=true;w.est=Math.max(10,w.reps*3)}}
        if(n>1){w.set=j;w.sets=n}
        if(s.how)w.how=s.how;
        P.push(w);
        if(j<n&&sr)P.push({ph:'rest',sec:sr,rd:k+1});
      }
      if(i<r.steps.length-1&&r.rest)P.push({ph:'rest',sec:r.rest,rd:k+1})});
    if(k<r.rounds-1&&r.roundRest)P.push({ph:'rest',sec:r.roundRest,rd:k+1,long:true});
  }
  if(r.cool)P.push({ph:'work',ex:coolId(),sec:r.cool,rd:0,label:'Cool-down'});
  return P;
}

const Snd={ctx:null,
  init(){try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},

};

  },
  credit(a,n){if(a.mode!=='free'||a.paused)return;const ms=n-a.curSince;if(ms>0){if(a.cur)a.acc[a.cur]=(a.acc[a.cur]||0)+ms;else a.restMs+=ms}a.curSince=n},
  creditPhase(a,p,ms){if(!p||ms<=0)return;if(p.ph==='work')a.acc[p.ex]=(a.acc[p.ex]||0)+ms;else if(p.ph==='rest')a.restMs+=ms},

  total(a,n){let t=a.restMs;for(const k in a.acc)t+=a.acc[k];if(a.mode==='free'){if(!a.paused)t+=n-a.curSince}else{const p=a.plan[a.idx];if(p&&p.ph!=='ready')t+=Math.min(E.phaseEl(a,n),capMs(p))}return t},

  pick(ex){const a=S.active,n=Date.now();E.credit(a,n);a.cur=ex;a.curSince=n;save();haptic()},
  advance(n){
    const a=S.active;if(!a||a.mode!=='routine'||a.paused||a.endAt)return;

function buildSession(a){

  if(a.mode==='routine'){const p=a.plan[a.idx];if(p){const ms=Math.min(a.phaseEl||0,capMs(p));if(p.ph==='work')acc[p.ex]=(acc[p.ex]||0)+ms;else if(p.ph==='rest')restMs+=ms}

function backupName(ext='json'){return `ember-backup-${dk(new Date())}.${ext}`}
function backupText(){const d=structuredClone(S);d.active=null;return JSON.stringify({app:'Ember',format:1,version:APP.version,exported:new Date().toISOString(),data:d})}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const l=document.createElement('a');l.href=u;l.download=name;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function markBackup(){S.settings.lastBackup=Date.now();commit()}
async function shareBackup(){
  const text=backupText(),name=backupName();
  for(const type of['application/json','text/plain']){
    const f=new File([text],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'Ember backup'});markBackup();snack('Backup shared')}catch(e){if(e.name!=='AbortError'){download(name,text,'application/json');markBackup();snack('Backup downloaded')}}
      return;
    }
  }
  download(name,text,'application/json');markBackup();snack('Backup downloaded');
}
function exportCSV(){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const rows=[['date','start','end','session_minutes','session_type','exercise','category','exercise_minutes','reps','sets','rest_minutes']];
  for(const s of S.sessions){const base=[dk(s.start),new Date(s.start).toTimeString().slice(0,5),new Date(s.end||s.start).toTimeString().slice(0,5),(s.dur/60).toFixed(2),s.routine||(s.manual?'Logged':'Free')];
    if(!s.items.length)rows.push([...base,'','','','','',(s.rest/60).toFixed(2)]);
    s.items.forEach(i=>{const e=exById(i.ex);rows.push([...base,e?.name||i.ex,e?.cat||'',(i.sec/60).toFixed(2),i.reps||'',Array.isArray(i.sets)?i.sets.join('+'):'',(s.rest/60).toFixed(2)])})}
  const text=rows.map(r=>r.map(q).join(',')).join('\n'),name=backupName('csv');
  const f=new File([text],name,{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Ember sessions'}).catch(e=>{if(e.name!=='AbortError')download(name,text,'text/csv')});
  else download(name,text,'text/csv');
}
async function importFile(file){
  let d;
  try{const raw=JSON.parse(await file.text());d=raw&&raw.data&&raw.app==='Ember'?raw.data:raw;if(!d||!Array.isArray(d.sessions))throw 0}
  catch(e){dialog({title:'Not an Ember backup',body:'This file could not be read as an Ember backup.',actions:[{label:'OK',val:1,cls:''}]});return}
  const inc=normalize(d),first=inc.sessions[0],newS=inc.sessions.filter(s=>!S.sessions.find(x=>x.id===s.id)).length;
  const v=await dialog({title:'Import backup',body:`${plural(inc.sessions.length,'session')} · ${plural(inc.exercises.length,'exercise')} · ${plural(inc.routines.length,'routine')}${first?`<br>From ${fmtD(first.start,{day:'numeric',month:'short',year:'numeric'})}`:''}<br><br>Merge adds ${plural(newS,'new session')}. Replace swaps everything for this file.`,
    actions:[{label:'Cancel',val:0},{label:'Replace',val:2,cls:'out'},{label:'Merge',val:1,cls:''}]});
  if(!v)return;
  await takeSnap('Before import');
  if(v===2){const keep=S.active;S=inc;S.active=keep;}
  else{
    for(const e of inc.exercises)if(!exById(e.id))S.exercises.push(e);
    for(const r of inc.routines)if(!S.routines.find(x=>x.id===r.id))S.routines.push(r);
    for(const s of inc.sessions)if(!S.sessions.find(x=>x.id===s.id))S.sessions.push(s);
    S.sessions.sort((a,b)=>a.start-b.start);
  }
  applyPrefs(S.settings);cachePrefs();commit();renderNav();
  snack(v===2?'Backup restored':`Merged ${plural(newS,'session')}`);

/* ================= confetti ================= */
function confetti(){
  if(reduced())return;
  const c=document.createElement('canvas');c.className='confetti';document.body.append(c);
  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),cols=['--pri','--ter','--c1','--c3','--c4'].map(v=>cs.getPropertyValue(v).trim()).concat(['#ff8a00','#ffc400']);
  const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*60,y:H*.38,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  const f=now=>{const t=now-t0;x.clearRect(0,0,W,H);for(const p of P){p.vy+=.45;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-t/1900);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}if(t<1900)requestAnimationFrame(f);else c.remove()};
  requestAnimationFrame(f);
}

  xset:el=>{XE[el.dataset.k]=el.dataset.v;XE.name=$('[data-xf=name]',XE.L.body).value;XE.L.refresh()},
  exSave:()=>{
    const name=$('[data-xf=name]',XE.L.body).value.trim();if(!name){snack('Give it a name');return}
    if(XE.id){Object.assign(exById(XE.id),{name,cat:XE.cat,kind:XE.kind,def:XE.def})}else S.exercises.push({id:'x'+uid(),name,cat:XE.cat,kind:XE.kind,def:XE.def});
    closeLayer(XE.L);commit();snack(XE.id?'Exercise updated':'Exercise added');
  },
  exDel:async()=>{
    const id=XE.id,used=S.sessions.some(s=>s.items.some(i=>i.ex===id))||S.routines.some(r=>r.steps.some(s=>s.ex===id));
    if(!await confirmD(`Remove ${esc(exById(id).name)}?`,used?'Your history keeps it; it just leaves the library.':'','Remove',true))return;
    if(used)exById(id).archived=true;else S.exercises=S.exercises.filter(e=>e.id!==id);
    closeLayer(XE.L);commit();snack('Exercise removed');
  },
  rt:el=>rtEdit(el.dataset.id),
  rtNew:()=>rtEdit(null),
  rtDesign:()=>{closeTopSheets();setTimeout(()=>rtEdit(null),60)},
  rtAddStep:()=>{const l=RE.steps[RE.steps.length-1];const s=l?{...l,ex:l.ex==='__new'?(exList()[0]?.id||''):l.ex,how:'',nn:''}:{ex:exList()[0].id,sec:40};delete s.ncat;delete s._k;RE.steps.push(s);RE.open=RE.steps.length-1;RE.fresh=RE.open;RE.L.refresh();haptic(6)},
  rtDelStep:el=>{if(RE.steps.length>1){const i=+el.dataset.i;rtFade(el,'gone',()=>{RE.steps.splice(i,1);RE.open=-1;RE.L.refresh()});haptic(8)}},
  rtOpen:el=>{const i=+el.dataset.i,was=RE.open,go=()=>{RE.open=was===i?-1:i;RE.fresh=RE.open;RE.L.refresh()};haptic(5);
    const cur=was>=0&&$('.stc.open',RE.L.body);if(cur)rtFade(cur,'shut',go);else go()},
  rtMove:el=>{const i=+el.dataset.i,j=i+ +el.dataset.d;if(j<0||j>=RE.steps.length)return;[RE.steps[i],RE.steps[j]]=[RE.steps[j],RE.steps[i]];RE.open=j;RE.fresh=j;RE.L.refresh();haptic(6)},
  rtMode:el=>{const s=RE.steps[+el.dataset.k.slice(5)];s.mode=el.dataset.v;if(s.mode==='reps'&&!(s.reps>0))s.reps=exById(s.ex)?.def||10;if(!(s.sec>0))s.sec=40;RE.L.refresh();haptic(6)},
  rtCat:el=>{RE.steps[+el.dataset.k.slice(5)].ncat=el.dataset.v;RE.L.refresh();haptic(6)},
  rtSave:()=>{
    const r=rtCollect();if(!r)return null;
    const i=S.routines.findIndex(x=>x.id===r.id);if(i>=0)S.routines[i]=r;else S.routines.push(r);
    closeLayer(RE.L);commit();snack('Routine saved');return r;
  },
  rtSaveGo:()=>{if(S.active){snack('Finish the current session first');return}const r=ACT.rtSave();if(r)setTimeout(()=>E.start('routine',r.id),260)},
  rtDel:async()=>{if(!await confirmD(`Delete ${esc(RE.name||'routine')}?`,'','Delete',true))return;S.routines=S.routines.filter(r=>r.id!==RE.id);closeLayer(RE.L);commit();snack('Routine deleted')},
  set:el=>{
    const k=el.dataset.k,v=el.dataset.v;
    const run=()=>{S.settings[k]=v!==''&&!isNaN(+v)?+v:v;
      if(['theme','palette','motion'].includes(k)){applyPrefs(S.settings);cachePrefs()}
      commit()};
    haptic(6);
    if((k==='theme'||k==='palette')&&document.startViewTransition&&!reduced())document.startViewTransition(run);else run();
  },
  step:el=>{
    const k=el.dataset.k,d=+el.dataset.d,st=S.settings;
    if(k==='weekGoal'){st.weekGoal=clamp(st.weekGoal+d,1,7);commit()}
    else if(k==='ready'){st.ready=clamp(st.ready+d*5,0,30);commit()}
    else if(k.startsWith('tgt:')){const w=+k.slice(4);st.targets[w]=clamp(st.targets[w]+d*5,0,300);commit();planSheet.L&&planSheet.L.refresh()}
    else if(k==='xe:def'){XE.def=clamp(XE.def+d*(XE.def+d>20?5:1),1,500);XE.name=$('[data-xf=name]',XE.L.body).value;XE.L.refresh()}
    else if(k.startsWith('rt:')){
      const f=k.slice(3);
      if(f.startsWith('sec:')){const s=RE.steps[+f.slice(4)];s.sec=clamp(s.sec+d*(s.sec>=120||(s.sec===120&&d>0)?30:5),5,1800)}
      else if(f.startsWith('reps:')){const s=RE.steps[+f.slice(5)],v=s.reps||10;s.reps=clamp(v+d*(v+d>20?5:1),1,500)}
      else if(f.startsWith('cap:')){const s=RE.steps[+f.slice(4)],v=s.cap||0;s.cap=clamp(v+d*(v>=120&&!(v===120&&d<0)?30:15),0,1800)}
      else if(f.startsWith('sets:')){const s=RE.steps[+f.slice(5)];s.sets=clamp((s.sets||1)+d,1,20)}
      else if(f==='setRest')RE.setRest=clamp((RE.setRest??RE.rest)+d*5,0,300);
      else if(f==='rounds')RE.rounds=clamp(RE.rounds+d,1,20);
      else if(f==='rest')RE.rest=clamp(RE.rest+d*5,0,300);
      else if(f==='roundRest')RE.roundRest=clamp(RE.roundRest+d*15,0,600);
      else if(f==='warm'||f==='cool')RE[f]=clamp(RE[f]+d*30,0,1200);
      RE.name=$('[data-rf=name]',RE.L.body).value;RE.L.refresh();
    }
    haptic(5);
  },
  plan:()=>planSheet(),
  planAll:el=>{S.settings.targets=S.settings.targets.map(()=>+el.dataset.v);commit();planSheet.L&&planSheet.L.refresh();haptic(8)},
  tip:el=>showTip(el),
  bkShare:()=>shareBackup(),
  bkDl:()=>{download(backupName(),backupText(),'application/json');markBackup();snack('Backup downloaded')},
  csv:()=>exportCSV(),
  imp:()=>{$('#impFile').value='';$('#impFile').click()},
  snaps:()=>snapsSheet(),
  snapGo:async el=>{
    const s=snapsSheet.list[+el.dataset.i];
    if(!await confirmD('Restore this point?',`Your current data (${plural(S.sessions.length,'session')}) is saved as a restore point first.`,'Restore'))return;
    await takeSnap('Before restore');const keep=S.active;S=normalize(s.data);S.active=keep;applyPrefs(S.settings);cachePrefs();closeLayer(snapsSheet.L);commit();snack('Restored');
  },
  erase:async()=>{
    if(!await confirmD('Erase all data?','Sessions, exercises, routines and settings are wiped. A restore point is kept on this device.','Erase',true))return;
    await takeSnap('Before erase');const pr=S.settings;S=freshState();S.settings.theme=pr.theme;S.settings.palette=pr.palette;S.settings.motion=pr.motion;commit();snack('All data erased');
  },
  sOpen:()=>openSession(),
  sMin:()=>closeLayer(Ov.L),
  sFinish:()=>finishSession(false),
  sPause:()=>{const a=S.active;if(!a)return;a.paused?E.resume():E.pause();haptic(12);sRender()},
  sPick:el=>{E.pick(el.dataset.id||null);sRender()},
  sMore:()=>{const L=sheet(()=>`<div class="st">Pick exercise</div>${CATS.map(([c,l],ci)=>{const xs=exList().filter(e=>e.cat===c).sort((p,q)=>p.name.localeCompare(q.name));return xs.length?`<div class="sub" style="margin:14px 6px 8px;font-weight:600"><i class="dot" style="background:var(--c${ci+1});margin-right:6px"></i>${l}</div><div class="chips">${xs.map(e=>`<button class="chip ${S.active.cur===e.id?'on':''}" data-act="sPickClose" data-id="${e.id}">${esc(e.name)}</button>`).join('')}</div>`:''}).join('')}`);ACT.sMore.L=L},
  sPickClose:el=>{E.pick(el.dataset.id);closeLayer(ACT.sMore.L);sRender()},
  sSet:()=>{const a=S.active;if(!a)return;const ex=a.mode==='free'?a.cur:a.plan[a.idx]?.ex,e=exById(ex);if(!e)return;const n=e.def||10;a.reps[ex]=(a.reps[ex]||0)+n;a.sets=a.sets||{};(a.sets[ex]=a.sets[ex]||[]).push(n);save(true);haptic(15);sRender()},
  qaOpen:el=>qaSheet(el.dataset.id),
  qaFromEx:el=>{closeTopSheets();quickAdd(el.dataset.id,exById(el.dataset.id)?.def||10)},
  qaAdd:el=>quickAdd(el.dataset.id,exById(el.dataset.id)?.def||10),
  qaUndo:el=>quickUndo(el.dataset.id),
  qaEx:el=>{QA.ex=el.dataset.id;QA.n=exById(QA.ex).def||10;QA.L.refresh()},
  qaN:el=>{QA.n=clamp((QA.n||0)+ +el.dataset.d,1,9999);qaPop();qaSync();haptic(6)},
  qaSet:el=>{QA.n=+el.dataset.v;qaPop();qaSync();haptic(6)},
  qaDef:()=>{const e=exById(QA.ex);e.def=QA.n;commit();qaSync();snack(`${e.name} default is now ${QA.n}`)},
  qaSave:()=>{if(!(QA.n>0)){snack('Enter a number');return}const L=QA.L;closeLayer(L);quickAdd(QA.ex,QA.n,QA.min*60)},
  sRep:el=>{const a=S.active;if(!a)return;const ex=a.mode==='free'?a.cur:a.plan[a.idx]?.ex;if(!ex)return;a.reps[ex]=Math.max(0,(a.reps[ex]||0)+ +el.dataset.d);repsPop(a.reps[ex]);save(true);haptic(10)},
  sSkip:el=>E.skip(+el.dataset.d),
  sGoal:el=>{const a=S.active,p=a&&a.plan&&a.plan[a.idx];if(!p||!p.reps)return;a.pv=a.pv||{};const v=a.pv[a.idx]!=null?a.pv[a.idx]:a.rc&&a.rc[a.idx]!=null?a.rc[a.idx]:p.reps;a.pv[a.idx]=clamp(v+ +el.dataset.d,0,9999);repsPop(a.pv[a.idx]);save(true);haptic(10)},
  sDone:()=>{const a=S.active;if(!a||a.mode!=='routine')return;Snd.init();if(a.paused)E.resume();E.skip(1)},
  sumSave:()=>sumSave(),
  sumResume:()=>{const a=S.active;if(!a)return;a.endAt=0;a.paused=true;closeLayer(Ov.sum);Ov.sum=null;E.resume();sRender()},
  sumDiscard:async()=>{if(!await confirmD('Discard this session?','The time will not be saved.','Discard',true))return;S.active=null;save(true);closeLayer(Ov.sum);Ov.sum=null;closeLayer(Ov.L);commit({render:false})},
};
function closeTopSheets(){for(let i=Layers.length-1;i>=0;i--){const L=Layers[i];if(L.sheet)closeLayer(L)}}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-nav]');
  if(n){hideTip();haptic(6);go(n.dataset.nav);return}
  const el=e.target.closest('[data-act]');
  if(!el||el.dataset.act!=='tip')hideTip();
  if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ed&&ED)edInput(t);
  else if(t.dataset.rf&&RE){const f=t.dataset.rf,s=RE.steps[+t.dataset.i];if(f==='name')RE.name=t.value;else if(f==='ex')rtPickEx(s,t.value);else if(f==='how')s.how=t.value;else if(f==='nn')s.nn=t.value;
    const h=(f==='how'||f==='nn')&&t.closest('.stc.open');if(h){h.querySelector('.t1').textContent=stName(s);h.querySelector('.t2').textContent=stSum(s)}}
  else if(t.dataset.xf&&XE)XE.name=t.value;
  else if(t.dataset.qa&&QA){if(t.dataset.qa==='n'){QA.n=clamp(parseInt(t.value)||0,0,9999);qaSync()}else QA.min=Math.max(0,parseFloat(t.value)||0)}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.ch;if(!k)return;
  if(k==='name'){S.settings.name=t.value.trim();commit({render:false});return}
  S.settings[k]=t.checked;haptic(6);commit({render:false});
  if(k==='wake'&&!t.checked)Wake.off();
});
$('#impFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f)});
/* line-chart crosshair */
function lineHover(e){
  const svg=e.target.closest&&e.target.closest('.lsvg');if(!svg)return;
  const ser=JSON.parse(svg.dataset.ser),W=+svg.dataset.w,H=+svg.dataset.h,r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*320;
  const n=ser.length,i=clamp(Math.round(sx/W*(n-1)),0,n-1),x=i/(n-1)*W,y=10+(1-ser[i][1])*(H-20);
  svg.classList.add('act');const xh=svg.querySelector('.xh'),xd=svg.querySelector('.xd');xh.setAttribute('x1',x);xh.setAttribute('x2',x);xd.setAttribute('cx',x);xd.setAttribute('cy',y);
  const ro=svg.closest('.card').querySelector('.ro');if(ro)ro.textContent=`${dayLong(pk(ser[i][0]))} · ${Math.round(ser[i][1]*100)}%`;
}
document.addEventListener('pointerdown',lineHover);document.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')lineHover(e)});

/* ================= lifecycle ================= */
async function syncFromStore(){
  if(!S||dirty||S.active||Layers.length||Ov.open)return;
  let r=null;try{r=localStorage.getItem('ember:rev')}catch(e){}
  if(!r||r===myRev)return;
  const d=await DB.get('state');
  if(!d||dirty||S.active||Layers.length||Ov.open)return;
  myRev=r;S=normalize(d);ver++;applyPrefs(S.settings);renderCur();
  if(S.active){if(S.active.endAt)showSummary();else openSession()}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){flush()}
  else{if(S&&S.active&&Ov.open)Wake.on();if(S){const n=Date.now();if(S.active){E.advance(n)}if(memo.tk!==dk(new Date())&&!Ov.open)renderCur()}syncFromStore()}
});
addEventListener('pagehide',()=>flush());
addEventListener('storage',e=>{if(e.key==='ember:rev')syncFromStore()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>S&&applyPrefs(S.settings));
setInterval(()=>{if(S&&memo.tk&&memo.tk!==dk(new Date())&&!Ov.open&&!Layers.length)renderCur()},60000);
(async()=>{
  await DB.open();
  try{myRev=localStorage.getItem('ember:rev')}catch(e){}
  let d=await DB.get('state');
  S=d?normalize(d):freshState();
  if(!d)save();
  applyPrefs(S.settings);cachePrefs();
  renderNav();renderView('today',true);enter($('#v-today'));
  if(S.active){if(S.active.endAt)showSummary();else openSession()}
  try{if(navigator.storage&&navigator.storage.persisted){persisted=await navigator.storage.persisted();if(!persisted&&navigator.storage.persist)persisted=await navigator.storage.persist()}}catch(e){}
})();
</script>
</body>
